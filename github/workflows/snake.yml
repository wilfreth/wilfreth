name: Generar serpiente de contribuciones
 
on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch:          # botón para correrlo a mano
  push:
    branches: [main]
 
permissions:
  contents: write
 
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#C1121F
            dist/snake-dark.svg?palette=github-dark&color_snake=#F77F00&color_dots=#161b22,#5c1a0b,#9c2a10,#d4500f,#FCBF49
 
      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
